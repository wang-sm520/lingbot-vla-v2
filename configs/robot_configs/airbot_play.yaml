states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 6
  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 6
            end: 7

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 6
      subtract_state: true
      relative_type: delta
  - action.effector.position:
      origin_keys:
        - action:
            start: 6
            end: 7
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.head
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.wrist

norm_stats: assets/norm_stats/airbot_play_multitask.json
