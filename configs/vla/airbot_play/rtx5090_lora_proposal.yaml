status: proposed_not_implemented
base_config: configs/vla/airbot_play/airbot_play.yaml
device: RTX_5090_32GB
dataset_episodes: 600
dataset_frames: 105882
prompt_source: dataset_task_table
optimizer_steps: 30000
seed: 42
precision: bfloat16
micro_batch_size: 1
gradient_accumulation_steps: 8
effective_batch_size: 8
gradient_checkpointing: true
freeze_vision_encoder: true
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - VLM_language_attention_q_proj_k_proj_v_proj_o_proj
    - action_expert_attention_q_proj_k_proj_v_proj_o_proj
  train_full_modules:
    - state_proj
    - action_in_proj
    - action_out_proj
    - action_time_mlp_in
    - action_time_mlp_out
  frozen_modules: all_other_pretrained_parameters
alignment:
  preserve_current_and_future_depth_heads: true
  preserve_current_and_future_video_heads: true
  use_official_teacher_losses: true
optimizer:
  name: AdamW
  learning_rate: 0.00005
  warmup_steps: 1000
  schedule: constant_after_warmup
  betas: [0.9, 0.95]
  weight_decay: 0.01
checkpoint:
  save_every_optimizer_steps: 2500
  keep_latest: 2
  preserve_final_step: 30000
  save: [adapters, trainable_projections, optimizer, scheduler, rng, data_position]
  final_export: merged_HF_checkpoint_with_config_and_normalization
verification_pending:
  - user_training_method_decision
  - adapter_injection_and_checkpoint_implementation
  - GPU_forward_backward_after_Pi05_30000_checkpoint_and_exit
  - peak_VRAM_and_finite_gradients
  - checkpoint_reload_and_offline_policy_inference
